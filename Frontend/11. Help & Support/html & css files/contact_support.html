<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#030713">
    <title>Contact Support | Nails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="HS.css">
    <link rel="stylesheet" href="support-pages.css">
    <link rel="stylesheet" href="../../Footer/footer.css">
</head>
<body>
    <main class="support-page">
        <div class="ambient-glow" aria-hidden="true"></div><div class="dot-pattern" aria-hidden="true"></div>
        <header class="topbar">
            <a class="back-button" href="HS.html" aria-label="Back to Help and Support"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16H6m0 0 10-10M6 16l10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
            <span class="brand-divider" aria-hidden="true"></span><div class="brand-copy"><strong>nails</strong><span>next action inputs linedup system</span></div>
        </header>
        <section class="support-content support-detail" aria-labelledby="detail-title">
            <div class="page-heading"><div class="support-tile" aria-hidden="true"><img src="../Assets/contact.png" alt=""></div><div><h1 id="detail-title">Contact Support</h1><p>We’re here to help with your questions.</p></div></div>
            <section class="detail-card contact-direct" aria-label="Contact us directly">
                <h2>Reach us directly</h2>
                <a href="mailto:support@nails.app"><span class="contact-symbol" aria-hidden="true"><img src="../Assets/email.png" alt=""></span><span><strong>Email</strong><small>support@nails.app</small></span></a>
            </section>
            <form class="detail-card support-form" id="contact-form">
                <h2>Send us a message</h2>
                <label>Your name<input id="contact-name" type="text" autocomplete="name" placeholder="Enter your name" required></label>
                <label>What can we help with?<select id="contact-topic"><option>General question</option><option>Account help</option><option>Backup or restore</option><option>Notifications</option><option>Other</option></select></label>
                <label>Message<textarea id="contact-message" rows="4" placeholder="Tell us how we can help..." required></textarea></label>
                <button class="detail-submit" type="submit">Continue to Email <span aria-hidden="true">→</span></button>
                <p class="detail-status" id="contact-status" role="status" aria-live="polite"></p>
            </form>
        </section>
        <nav class="bottom-nav" aria-label="Main navigation">
            <a class="nav-item" href="../../5. Home Page/html &amp; css files/home.html"><img src="../../Footer/Assets/Home.png" alt="" aria-hidden="true"><span>Home</span></a>
            <a class="nav-item is-current" aria-current="page" href="../../10. Settings/html &amp; css files/settings.html"><img src="../../Footer/Assets/Settings.png" alt="" aria-hidden="true"><span>Settings</span></a>
            <a class="nav-item" href="../../12. Profile/html &amp; css files/profile.html"><img src="../../Footer/Assets/Profile.png" alt="" aria-hidden="true"><span>Profile</span></a>
        </nav>
    </main>
    <script>
        document.getElementById('contact-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const subject = `Nails support: ${document.getElementById('contact-topic').value}`;
            const body = `Name: ${document.getElementById('contact-name').value.trim()}\n\n${document.getElementById('contact-message').value.trim()}`;
            document.getElementById('contact-status').textContent = 'Opening your email app with the message details…';
            window.location.href = `mailto:support@nails.app?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        });
    </script>
</body>
</html>
