
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAILS - Splash Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="splash-screen">

        <!-- Background Glow -->
        <div class="background-glow"></div>

        <!-- Logo and Branding -->
        <section class="brand-content">

            <div class="logo-container">

                <img class="brand-logo" src="../Assets/splash-screen-logo.png" alt="Nails logo">

            </div>

            <div class="brand-name">nails</div>

            <p class="tagline">
                next action inputs linedup system
            </p>

        </section>

        <div class="loading-status" role="status" aria-live="polite">
            <span class="loading-spinner" aria-hidden="true"></span>
            <span>Loading application</span>
        </div>

    </main>

</body>
</html>
