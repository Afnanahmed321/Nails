<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030713">
    <title>Select contact | Nails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="select_contact.css">
    <link rel="stylesheet" href="../../Footer/footer.css">
</head>
<body>
    <main class="contacts-page">
        <div class="contacts-glow" aria-hidden="true"></div>

        <header class="contacts-header">
            <a class="back-button" href="../../5. Home Page/html &amp; css files/home.html" aria-label="Back to chats">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16H6m0 0 10-10M6 16l10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <div class="header-title">
                <h1>Select contact</h1>
                <p>7 contacts</p>
            </div>
            <button class="header-icon" id="search-toggle" type="button" aria-label="Search contacts" aria-expanded="false">
                <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="13.5" cy="13.5" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m21 21 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </header>

        <label class="contact-search" id="contact-search-panel" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input id="contact-search" type="search" placeholder="Search contacts" autocomplete="off" aria-label="Search contacts">
        </label>

        <div class="contacts-scroll">
            <section class="contacts-section" aria-labelledby="contacts-title">
                <h2 id="contacts-title">Contacts on Nails</h2>
                <div class="contact-list" id="contact-list">
                    <button class="contact-row" type="button" data-contact="General Manager"><span class="contact-avatar">GM</span><span class="contact-copy"><strong>General Manager</strong><small>+91 ••••• 2841</small></span><svg class="contact-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <button class="contact-row" type="button" data-contact="Team Leader"><span class="contact-avatar">TL</span><span class="contact-copy"><strong>Team Leader</strong><small>+91 ••••• 6382</small></span><svg class="contact-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <button class="contact-row" type="button" data-contact="Account Executive"><span class="contact-avatar">AE</span><span class="contact-copy"><strong>Account Executive</strong><small>+91 ••••• 4507</small></span><svg class="contact-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <button class="contact-row" type="button" data-contact="Field Engineer"><span class="contact-avatar">FE</span><span class="contact-copy"><strong>Field Engineer</strong><small>+91 ••••• 1793</small></span><svg class="contact-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <button class="contact-row" type="button" data-contact="Sales Representative"><span class="contact-avatar">SR</span><span class="contact-copy"><strong>Sales Representative</strong><small>+91 ••••• 8026</small></span><svg class="contact-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <button class="contact-row" type="button" data-contact="Legal Counsel"><span class="contact-avatar">LC</span><span class="contact-copy"><strong>Legal Counsel</strong><small>+91 ••••• 7315</small></span><svg class="contact-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    <button class="contact-row" type="button" data-contact="HR Manager"><span class="contact-avatar">HR</span><span class="contact-copy"><strong>HR Manager</strong><small>+91 ••••• 9264</small></span><svg class="contact-chevron" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 3 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                </div>
            </section>

            <section class="invite-section" aria-labelledby="invite-title">
                <h2 id="invite-title">Invite to Nails</h2>
                <div class="invite-list">
                    <article class="invite-card"><span class="invite-avatar">AN</span><span class="invite-copy"><strong>A Aneth Noël</strong><small>+91 ••••• 3975</small></span><button type="button" class="invite-button">Invite</button></article>
                    <article class="invite-card"><span class="invite-avatar">AR</span><span class="invite-copy"><strong>Abdul Rahman</strong><small>+91 ••••• 6418</small></span><button type="button" class="invite-button">Invite</button></article>
                    <article class="invite-card"><span class="invite-avatar">A</span><span class="invite-copy"><strong>Airtel</strong><small>+91 ••••• 9032</small></span><button type="button" class="invite-button">Invite</button></article>
                </div>
            </section>
        </div>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a class="nav-item is-current" aria-current="page" href="../../5. Home Page/html &amp; css files/home.html"><img src="../../Footer/Assets/Home.png" alt="" aria-hidden="true"><span>Home</span></a>
            <a class="nav-item" href="../../10. Settings/html &amp; css files/settings.html"><img src="../../Footer/Assets/Settings.png" alt="" aria-hidden="true"><span>Settings</span></a>
            <a class="nav-item" href="../../12. Profile/html &amp; css files/profile.html"><img src="../../Footer/Assets/Profile.png" alt="" aria-hidden="true"><span>Profile</span></a>
        </nav>
    </main>
    <script>
        const searchToggle = document.querySelector("#search-toggle");
        const searchPanel = document.querySelector("#contact-search-panel");
        const searchInput = document.querySelector("#contact-search");

        searchToggle.addEventListener("click", () => {
            searchPanel.hidden = !searchPanel.hidden;
            searchToggle.setAttribute("aria-expanded", String(!searchPanel.hidden));
            if (!searchPanel.hidden) searchInput.focus();
            else {
                searchInput.value = "";
                searchInput.dispatchEvent(new Event("input"));
            }
        });

        searchInput.addEventListener("input", () => {
            const query = searchInput.value.trim().toLowerCase();
            document.querySelectorAll(".contact-row").forEach((row) => {
                row.hidden = !row.textContent.toLowerCase().includes(query);
            });
        });

        document.querySelectorAll(".contact-row").forEach((row) => {
            row.addEventListener("click", () => {
                sessionStorage.setItem("nails-selected-contact", row.dataset.contact);
                window.location.href = new URL("assign.html", window.location.href).href;
            });
        });

        document.querySelectorAll(".invite-button").forEach((button) => {
            button.addEventListener("click", () => {
                button.textContent = "Invite sent";
                button.disabled = true;
                button.classList.add("is-sent");
            });
        });
    </script>
</body>
</html>
