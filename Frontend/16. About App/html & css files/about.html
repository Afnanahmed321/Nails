<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030713">
    <title>About Nails | Nails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="../../Footer/footer.css">
</head>
<body>
    <main class="about-page">
        <div class="ambient-glow" aria-hidden="true"></div>
        <div class="dot-pattern" aria-hidden="true"></div>

        <header class="topbar">
            <a class="back-button" href="../../10. Settings/html &amp; css files/settings.html" aria-label="Back to Settings"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16H6m0 0 10-10M6 16l10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
            <span class="brand-divider" aria-hidden="true"></span>
            <div class="brand-copy"><strong>nails</strong><span>next action inputs linedup system</span></div>
        </header>

        <section class="about-content" aria-labelledby="about-title">
            <div class="page-heading">
                <div class="about-tile" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M20 18v10m0-16h.01" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/></svg></div>
                <div><h1 id="about-title">About Application</h1><p>Learn more about Nails.</p></div>
            </div>

            <section class="brand-card" aria-label="About Nails">
                <div class="app-logo"><img src="../../2. Welcome/Assets/logo.png" alt="Nails app logo"></div>
                <h2>nails</h2>
                <p class="tagline">next action inputs linedup system</p>
                <p class="brand-description">A clear, focused way for teams to assign tasks, share updates, and keep work moving.</p>
                <span class="version-pill">Version 1.0.0</span>
            </section>

            <section class="video-section" aria-labelledby="video-section-title">
                <div class="video-section-heading">
                    <div><h2 id="video-section-title">Watch a video</h2><p>See how Nails works.</p></div>
                    <button class="share-video" id="share-video" type="button" aria-label="Share video"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8.7 10.6 6.6-4.2m-6.6 7 6.6 4.1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Share</span></button>
                </div>
                <button class="video-thumbnail" id="play-video" type="button" aria-label="Play YouTube video">
                    <span class="thumbnail-glow" aria-hidden="true"></span>
                    <span class="thumbnail-brand" aria-hidden="true"><img src="../../2. Welcome/Assets/logo.png" alt=""><strong>nails</strong></span>
                    <span class="thumbnail-ui" aria-hidden="true"><span></span><span></span><span></span></span>
                    <span class="youtube-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6.5v11l9-5.5-9-5.5Z" fill="currentColor"/></svg></span>
                    <span class="thumbnail-caption"><strong>Nails video</strong><small>Watch on YouTube</small></span>
                    <span class="thumbnail-duration">▶ &nbsp; WATCH</span>
                </button>
                <p class="share-status" id="share-status" role="status" aria-live="polite"></p>
            </section>

        </section>

        <section class="video-player-overlay" id="video-player-overlay" role="dialog" aria-modal="true" aria-labelledby="video-player-title" hidden>
            <div class="video-player-panel">
                <header><h2 id="video-player-title">Nails video</h2><button id="close-video" type="button" aria-label="Close video">×</button></header>
                <div class="video-frame"><iframe id="youtube-player" title="YouTube video about Nails" src="about:blank" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
            </div>
        </section>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a class="nav-item" href="../../5. Home Page/html & css files/home.html"><img src="../../Footer/Assets/Home.png" alt="" aria-hidden="true"><span>Home</span></a>
            <a class="nav-item is-current" href="../../10. Settings/html &amp; css files/settings.html" aria-current="page"><img src="../../Footer/Assets/Settings.png" alt="" aria-hidden="true"><span>Settings</span></a>
            <a class="nav-item" href="../../12. Profile/html &amp; css files/profile.html"><img src="../../Footer/Assets/Profile.png" alt="" aria-hidden="true"><span>Profile</span></a>
        </nav>
    </main>
<script>
    const videoUrl = "https://youtu.be/aqz-KE-bpKQ";
    const playerOverlay = document.getElementById("video-player-overlay");
    const youtubePlayer = document.getElementById("youtube-player");
    const shareStatus = document.getElementById("share-status");

    document.getElementById("play-video").addEventListener("click", () => {
        youtubePlayer.src = "https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?autoplay=1";
        playerOverlay.hidden = false;
        document.getElementById("close-video").focus();
    });

    function closeVideo() {
        playerOverlay.hidden = true;
        youtubePlayer.src = "about:blank";
        document.getElementById("play-video").focus();
    }

    document.getElementById("close-video").addEventListener("click", closeVideo);
    playerOverlay.addEventListener("click", (event) => {
        if (event.target === playerOverlay) closeVideo();
    });
    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !playerOverlay.hidden) closeVideo();
    });

    document.getElementById("share-video").addEventListener("click", async () => {
        try {
            if (navigator.share) {
                await navigator.share({ title: "Nails video", url: videoUrl });
                shareStatus.textContent = "Video shared.";
            } else if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(videoUrl);
                shareStatus.textContent = "Video link copied.";
            } else {
                shareStatus.textContent = videoUrl;
            }
        } catch (error) {
            if (error.name !== "AbortError") shareStatus.textContent = "Could not share the video link.";
        }
    });
</script>
</body>
</html>
