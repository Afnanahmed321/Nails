
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030713">

    <title>Welcome to Nails</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="welcome.css">
</head>

<body>

    <main class="welcome-page">

        <div class="ambient-glow"></div>

        <!-- BRAND -->
        <header class="brand">

            <div class="logo-frame">
                <img src="../Assets/logo.png" alt="Nails Logo" class="logo-image">
            </div>

            <h2 class="brand-name">nails</h2>

            <p class="brand-tagline">
                next action inputs linedup system
            </p>

        </header>


        <!-- WELCOME CONTENT -->
        <section class="welcome-content">

            <div class="intro">

                <h1>
                    Assign Tasks.<br>
                    <span>Get Clarity.</span>
                </h1>

                <p class="description">
                    A minimal and secure way to assign tasks
                    and get responses — no clutter, just action.
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form class="login-form" action="#" method="get">

                <label class="phone-field">

                    <span class="visually-hidden">
                        Mobile number
                    </span>

                    <select class="country-code" aria-label="Country calling code">
                        <option value="+91">+91</option>
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                    </select>

                    <span class="field-divider"></span>

                    <input
                        type="tel"
                        name="phone"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        placeholder="Enter mobile number"
                        required
                    >

                </label>


                <!-- WHATSAPP BUTTON -->
                <button class="whatsapp-button" type="submit">

                    <img class="whatsapp-icon" src="../Assets/whatsapp-icon.png" alt="" aria-hidden="true">
                    <span>Send WhatsApp OTP</span>

                    <svg class="arrow-icon" viewBox="0 0 32 32" aria-hidden="true">
                        <path
                            d="M5 16h21M17 6l10 10-10 10"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>

                </button>

            </form>


            <!-- PRIVACY NOTE -->
            <div class="privacy-note">

                <svg viewBox="0 0 32 36" aria-hidden="true">
                    <path
                        d="M16 2 28 7v9c0 8-5.2 14.2-12 18C9.2 30.2 4 24 4 16V7l12-5Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linejoin="round"
                    />

                    <path
                        d="m11 17 3.5 3.5L21.5 13"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>

                <p>
                    We’ll send a one-time password (OTP) on WhatsApp
                    to verify your number.
                </p>

            </div>

        </section>

    </main>

</body>
</html>
