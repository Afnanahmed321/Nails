
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030713">

    <title>Welcome to Nails</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="welcome.css">
</head>

<body>

    <main class="welcome-page">

        <div class="ambient-glow"></div>

        <!-- BRAND -->
        <header class="brand">

            <div class="logo-frame">
                <img src="../Assets/logo.png" alt="Nails Logo" class="logo-image">
            </div>

            <h2 class="brand-name">nails</h2>

            <p class="brand-tagline">
                next action inputs linedup system
            </p>

        </header>


        <!-- WELCOME CONTENT -->
        <section class="welcome-content">

            <!-- LOGIN FORM -->
            <form class="login-form" id="registration-form">

                <label class="phone-field">

                    <span class="visually-hidden">
                        Mobile number
                    </span>

                    <select class="country-code" aria-label="Country calling code">
                        <option value="+91">+91</option>
                        <option value="+1">+1</option>
                        <option value="+44">+44</option>
                    </select>

                    <span class="field-divider"></span>

                    <input
                        type="tel"
                        name="phone"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        placeholder="Enter mobile number"
                        required
                    >

                </label>


                <!-- WHATSAPP BUTTON -->
                <button class="whatsapp-button" type="submit">

                    <span>Generate OTP</span>

                    <svg class="arrow-icon" viewBox="0 0 32 32" aria-hidden="true">
                        <path
                            d="M5 16h21M17 6l10 10-10 10"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>

                </button>

            </form>
        </section>

    </main>

    <script>
        document.querySelector("#registration-form").addEventListener("submit", (event) => {
            event.preventDefault();
            const countryCode = document.querySelector(".country-code").value;
            const phone = document.querySelector('.phone-field input[type="tel"]').value.replace(/\D/g, "");
            sessionStorage.setItem("nails-phone", `${countryCode} ${phone}`);
            window.location.href = new URL(
                "../../3. OTP verification/html & css files/otp.html",
                window.location.href
            ).href;
        });
    </script>

</body>
</html>
