<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030713">
    <title>Chat Backup | Nails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chats_backup.css">
    <link rel="stylesheet" href="../../Footer/footer.css">
</head>
<body>
    <main class="backup-page">
        <div class="ambient-glow" aria-hidden="true"></div>
        <div class="dot-pattern" aria-hidden="true"></div>

        <header class="topbar">
            <a class="back-button" id="backup-back" href="../../5. Home Page/html & css files/home.html" aria-label="Back">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16H6m0 0 10-10M6 16l10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <span class="brand-divider" aria-hidden="true"></span>
            <div class="brand-copy"><strong>nails</strong><span>next action inputs linedup system</span></div>
        </header>

        <section class="backup-content" aria-labelledby="backup-title">
            <div class="page-heading">
                <div class="backup-tile" aria-hidden="true">
                    <img src="../../10. Settings/Assets/backup.png" alt="" aria-hidden="true">
                </div>
                <div><h1 id="backup-title">Chat Backup</h1><p>Keep your conversations safe.</p></div>
            </div>

            <section class="backup-info" aria-labelledby="backup-conversation-title">
                <div class="backup-info-copy">
                    <h2 id="backup-conversation-title">Backup your chats</h2>
                    <p>Save important conversations securely and restore them whenever needed.</p>
                </div>
                <img class="backup-illustration" src="../Assets/chat_backup.png" alt="Chat bubbles backed up to the cloud">
            </section>

            <section class="last-backup" aria-label="Last backup status">
                <div class="calendar-icon" aria-hidden="true">
                    <svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="21" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 4v6m12-6v6M4 13h24M10 18h.1M16 18h.1M22 18h.1M10 23h.1M16 23h.1M22 23h.1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </div>
                <div class="last-backup-copy"><strong>Last Backup</strong><span>18 Nov 2026, 10:24 PM</span></div>
                <span class="status-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Completed</span>
            </section>

            <button class="start-backup" id="start-backup" type="button">
                <img src="../../10. Settings/Assets/backup.png" alt="" aria-hidden="true">
                <span>Start Backup</span>
            </button>
        </section>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a class="nav-item" href="../../5. Home Page/html & css files/home.html"><img src="../../Footer/Assets/Home.png" alt="" aria-hidden="true"><span>Home</span></a>
            <a class="nav-item" href="../../10. Settings/html &amp; css files/settings.html"><img src="../../Footer/Assets/Settings.png" alt="" aria-hidden="true"><span>Settings</span></a>
            <a class="nav-item" href="../../12. Profile/html &amp; css files/profile.html"><img src="../../Footer/Assets/Profile.png" alt="" aria-hidden="true"><span>Profile</span></a>
        </nav>
    </main>
    <script>
        const backupSource = new URLSearchParams(window.location.search).get("source");
        const backLink = document.querySelector("#backup-back");
        const footerLinks = [...document.querySelectorAll(".bottom-nav .nav-item")];

        if (backupSource === "chat") {
            backLink.href = "../../7. Chat/html and css files/chats.html";
        }

        const activeFooterItem = backupSource === "chat" ? footerLinks[0] : footerLinks[1];
        activeFooterItem.classList.add("is-current");
        activeFooterItem.setAttribute("aria-current", "page");

        const startBackupButton = document.querySelector("#start-backup");
        if (localStorage.getItem("nails-backup-up-to-date") === "true") {
            startBackupButton.querySelector("span").textContent = "Backup up to date";
            startBackupButton.classList.add("is-up-to-date");
        }

        function startBackup() {
            localStorage.removeItem("nails-backup-up-to-date");
            const backupType = backupSource === "chat" ? "conversation" : "all";
            const params = new URLSearchParams({ type: backupType, source: backupSource === "chat" ? "chat" : "settings" });
            window.location.href = `../../9. Backup Status/html & css files/backup_status.html?${params.toString()}`;
        }

        startBackupButton.addEventListener("click", startBackup);
    </script>
</body>
</html>
